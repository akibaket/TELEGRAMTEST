
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App - TON / Gram Deposit</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- TON Connect UI SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }
        .ton-glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .pulse-glow {
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4">

    <!-- Header / Navbar -->
    <header class="w-full max-w-md flex justify-between items-center py-3 px-4 ton-glass rounded-2xl mb-4">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-full bg-sky-500/20 flex items-center justify-center text-sky-400 font-bold">
                <i class="fa-solid fa-paper-plane"></i>
            </div>
            <span class="font-semibold text-sm tracking-wide">GRAM Mini App</span>
        </div>
        <!-- Contenedor del Botón TON Connect UI -->
        <div id="ton-connect-button"></div>
    </header>

    <!-- Main Content / Balance Display -->
    <main class="w-full max-w-md flex-1 flex flex-col justify-center items-center my-auto text-center px-2">
        
        <!-- Tarjeta del Saldo -->
        <div class="w-full ton-glass rounded-3xl p-8 pulse-glow relative overflow-hidden transition-all duration-300 transform hover:scale-[1.01]">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-sky-500/10 rounded-full blur-2xl"></div>
            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-blue-600/10 rounded-full blur-2xl"></div>

            <p class="text-xs font-medium uppercase tracking-widest text-slate-400 mb-2">Tu Saldo Disponible</p>
            
            <div class="flex items-center justify-center space-x-2 my-2">
                <span id="user-balance" class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-blue-500 tracking-tight">0.00</span>
                <span class="text-xl font-bold text-sky-400">GRAM</span>
            </div>

            <p class="text-xs text-slate-400 mt-2">
                Tasa de depósito: <span class="text-emerald-400 font-semibold">0.01 TON</span> = <span class="text-emerald-400 font-semibold">1.00 GRAM (x10,000)</span>
            </p>
        </div>

        <!-- Estado de la Transacción / Polling Status -->
        <div id="status-container" class="w-full mt-4 p-3 rounded-xl ton-glass hidden transition-all duration-300">
            <div class="flex items-center justify-center space-x-3 text-sm">
                <div id="status-spinner" class="animate-spin text-sky-400"><i class="fa-solid fa-circle-notch"></i></div>
                <span id="status-text" class="text-slate-300 font-medium">Esperando confirmación en la blockchain...</span>
            </div>
        </div>

        <!-- Botón de Depósito Principal -->
        <button id="deposit-btn" onclick="handleDeposit()" class="w-full mt-6 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transition-all duration-200 transform active:scale-95 flex items-center justify-center space-x-3 group">
            <i class="fa-solid fa-wallet group-hover:rotate-12 transition-transform"></i>
            <span class="text-lg">Depositar 0.01 TON</span>
        </button>

        <p class="text-xs text-slate-500 mt-4">
            * Transacciones reales procesadas en la Blockchain de TON Mainnet.
        </p>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-md text-center py-3 text-xs text-slate-500">
        Demo TON Connect Telegram Mini App • TON Mainnet Integrated
    </footer>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        // 1. Inicialización de Telegram WebApp SDK
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            document.body.style.backgroundColor = tg.backgroundColor || "#0f172a";
        }

        // 2. Configuración de Variables y Wallet Destino Real
        let currentBalance = 0.0000;
        const DEPOSIT_AMOUNT_TON = "0.01"; 
        const NANO_TON_FACTOR = 1000000000; // 1 TON = 1,000,000,000 nanoTONs
        const MULTIPLIER = 10000; // 0.0001 TON * 10,000 = 1.00 GRAM
        
        // Billetera de destino real proporcionada
        const RECIPIENT_ADDRESS = "UQBBce7c0BKyayUd0J4qAywYURWmzkVk3P0q9bXLMPmWNTae"; 

        // Endpoint de consulta pública a la red de TON Mainnet (TonCenter API)
        const TONCENTER_API_URL = "https://toncenter.com/api/v2/getTransactions";

        // 3. Inicializar TON Connect UI SDK
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://ton-connect.github.io/demo-dapp-with-react-ui/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        function updateBalanceDisplay() {
            document.getElementById('user-balance').innerText = currentBalance.toFixed(2);
        }

        function setStatus(show, text = "", isLoading = true) {
            const container = document.getElementById('status-container');
            const statusText = document.getElementById('status-text');
            const spinner = document.getElementById('status-spinner');

            if (show) {
                container.classList.remove('hidden');
                statusText.innerText = text;
                if (isLoading) {
                    spinner.classList.remove('hidden');
                } else {
                    spinner.classList.add('hidden');
                }
            } else {
                container.classList.add('hidden');
            }
        }

        // 4. Manejador del Botón de Depósito Real
        async function handleDeposit() {
            if (!tonConnectUI.connected) {
                if (tg && tg.showAlert) {
                    tg.showAlert("Por favor conecta tu Wallet de TON primero.");
                } else {
                    alert("Por favor conecta tu Wallet de TON primero.");
                }
                tonConnectUI.openModal();
                return;
            }

            const depositBtn = document.getElementById('deposit-btn');
            depositBtn.disabled = true;
            depositBtn.classList.add('opacity-50', 'cursor-not-allowed');

            // 100,000 nanoTONs para 0.0001 TON
            const amountInNano = (parseFloat(DEPOSIT_AMOUNT_TON) * NANO_TON_FACTOR).toString();
            // Marca de tiempo de la solicitud para validar en la blockchain
            const requestTimestamp = Math.floor(Date.now() / 1000) - 10; 

            try {
                // Estructura simplificada y nativa de transacción TON Connect sin payload complejo propenso a errores
                const transaction = {
                    validUntil: Math.floor(Date.now() / 1000) + 600, // 10 minutos para firmar en la wallet
                    messages: [
                        {
                            address: RECIPIENT_ADDRESS,
                            amount: amountInNano
                        }
                    ]
                };

                setStatus(true, "Abriendo tu Wallet para firmar la transacción...");

                // Esto invoca la Wallet conectada (Tonkeeper/Telegram Wallet) para que el usuario firme
                const result = await tonConnectUI.sendTransaction(transaction);
                
                setStatus(true, "¡Transacción firmada! Esperando confirmación en la red TON...", true);

                // 5. Iniciar monitoreo real en la red TON (Polling a la Blockchain)
                const isConfirmed = await verifyTransactionOnBlockchain(amountInNano, requestTimestamp);

                if (isConfirmed) {
                    const creditedAmount = parseFloat(DEPOSIT_AMOUNT_TON) * MULTIPLIER;
                    currentBalance += creditedAmount;
                    updateBalanceDisplay();

                    setStatus(true, `¡Depósito confirmado en la Blockchain! +${creditedAmount.toFixed(2)} GRAM.`, false);
                    
                    if (tg && tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('success');
                    }
                    setTimeout(() => setStatus(false), 6000);
                } else {
                    setStatus(true, "No se detectó el pago a tiempo en la red. Si firmaste, reintenta en unos segundos.", false);
                    setTimeout(() => setStatus(false), 5000);
                }

            } catch (error) {
                console.error("Error o cancelación de la transacción:", error);
                setStatus(true, "Transacción cancelada por el usuario en la Wallet.", false);
                setTimeout(() => setStatus(false), 4000);
            } finally {
                depositBtn.disabled = false;
                depositBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // 6. Polling Asíncrono Real a la Blockchain de TON
        async function verifyTransactionOnBlockchain(expectedAmountNano, minTimestamp, maxAttempts = 15, delayMs = 4000) {
            const senderAddress = tonConnectUI.account?.address;

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                try {
                    setStatus(true, `Verificando confirmación en TON Blockchain... (${attempt}/${maxAttempts})`, true);
                    
                    // Consultar últimas transacciones recibidas por tu billetera receptora
                    const response = await fetch(`${TONCENTER_API_URL}?address=${RECIPIENT_ADDRESS}&limit=10`);
                    const data = await response.json();

                    if (data.ok && Array.isArray(data.result)) {
                        for (const tx of data.result) {
                            // Validar que la transacción haya ocurrido después de pulsar el botón
                            if (tx.utime >= minTimestamp) {
                                const inMsg = tx.in_msg;
                                // Verificar que el valor entregado coincida exactamente (100,000 nanoTONs)
                                if (inMsg && inMsg.value === expectedAmountNano) {
                                    return true; // Transacción confirmada en la Blockchain!
                                }
                            }
                        }
                    }
                } catch (err) {
                    console.warn("Error consultando RPC node de TON:", err);
                }

                // Esperar a que se mine el próximo bloque en la red TON (aprox. 3-4 segundos)
                await new Promise(res => setTimeout(res, delayMs));
            }
            return false;
        }
    </script>
</body>
</html>
```
